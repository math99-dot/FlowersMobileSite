
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Flowers by Clara</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>

<header>
    <div class="logo">Flowers by Clara</div>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="wedding.html">Weddings</a>
        <a href="gallery.html">Gallery</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <h1>Contact Us</h1>
    <p>Have questions or want to place an order? Fill out the form below!</p>

    <form id="contactForm">
        <label>Name:</label>
        <input type="text" id="name" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Message:</label>
        <textarea id="message" required></textarea>

        <button type="submit">Send Message</button>
        <p id="formMessage"></p>
    </form>
</main>

<footer>
    <p>© 2026 Flowers by Clara</p>
</footer>

</body>
</html>
